<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Home Energy" />
    <meta
      name="description"
      content="Your home energy, solar and battery dashboard."
    />
    <title>Home Energy · Overview</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      #boot-loading { position:fixed; inset:0; display:grid; place-items:center; background:#f5f6f0; z-index:9999; }
      #boot-loading span { width:34px; height:34px; border:3px solid #dce5d5; border-top-color:#6f9f35; border-radius:50%; animation:boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot-loading" role="status" aria-label="Loading Home Energy"><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
